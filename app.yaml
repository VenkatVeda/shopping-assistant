command: ["python", "app.py"]
env:

  - name: FLASK_ENV
    value: production

  - name: FLASK_SECRET_KEY
    valueFrom: flask-secret-key

  - name: ENABLE_PERSONALIZATION
    value: "true"

  # JWT Configuration
  - name: JWT_SECRET_KEY
    valueFrom: jwt-secret-key

  # Databricks workspace URL — must include https:// scheme
  - name: DATABRICKS_HOST
    value: "https://adb-4206962778623078.18.azuredatabricks.net"

  # SQL Warehouse for persistent storage
  - name: DATABRICKS_WAREHOUSE_ID
    value: "8eba55b5eb828697"
  - name: DATABRICKS_SQL_WAREHOUSE_ID
    valueFrom: databricks-sql-warehouse-id

  # Databricks Foundation Model Endpoints
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: "databricks-bge-large-en"
  - name: DATABRICKS_CHAT_ENDPOINT
    value: "databricks-meta-llama-3-1-8b-instruct"
  - name: DATABRICKS_INTENT_ENDPOINT
    value: "databricks-meta-llama-3-1-8b-instruct"

  # MCP Vector Store Configuration
  - name: USE_MCP_VECTOR_SEARCH
    value: "false"
  - name: VECTOR_STORE_TYPE
    value: "databricks"

  # Databricks Vector Search Configuration
  - name: DATABRICKS_VECTOR_ENDPOINT
    value: "bags-vector-search-endpoint"
  - name: DATABRICKS_VECTOR_INDEX
    value: "sandbox.venkat.bags_embeddings_v2_index"
  - name: DATABRICKS_SOURCE_TABLE
    value: "sandbox.venkat.bags_embeddings_v2"
  - name: VECTOR_EMBEDDING_DIMENSION
    value: "1024"
  - name: VECTOR_PRIMARY_KEY
    value: "product_id"
  - name: VECTOR_EMBEDDING_COLUMN
    value: "embedding"

  # Pinecone (dummy — app uses Databricks vector search)
  - name: PINECONE_API_KEY
    value: "dummy"
  - name: PINECONE_INDEX_NAME
    value: "dummy"

  # Audit Trail Configuration
  - name: AUDIT_APP_ID
    value: "ecom-shop-assistant-dev"
  - name: AUDIT_CATALOG
    valueFrom: audit-catalog
  - name: AUDIT_SECRET_SCOPE
    valueFrom: audit-secret-scope

  # User defaults
  - name: DEFAULT_USER_COUNTRY
    value: "US"

  # Google OAuth
  - name: GOOGLE_CLIENT_ID
    valueFrom: google-client-id
  - name: GOOGLE_CLIENT_SECRET
    valueFrom: google-client-secret
