<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Shopping Assistant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 50%, #ffa07a 100%);
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.3);
            text-align: center;
            max-width: 400px;
        }
        h2 {
            color: #ff6b35;
            margin-bottom: 10px;
            font-weight: 600;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ff6b35;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }
        .google-btn:hover {
            background: #ff8c42;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🛍️ Smart Shopping Assistant</h2>
        <p>Sign in to access your personalized shopping experience</p>
        <a href="/oauth/login" class="google-btn">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">

                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>

            </svg>
            Continue with Google
        </a>
    </div>
</body>
</html>
